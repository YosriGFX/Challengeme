<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101418">
  <title>Challenge Me</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root { color-scheme: dark; --bg: #101418; --panel: #1b2128; --text: #e8eef2; --muted: #93a1ad; --accent: #6cd38a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 16px/1.4 system-ui, sans-serif; padding: 16px; }
    main { width: min(100%, 420px); background: var(--panel); border-radius: 16px; padding: 24px; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p { margin: 0 0 20px; color: var(--muted); }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
    select, button { width: 100%; height: 48px; border-radius: 12px; font: inherit; }
    select { background: var(--bg); color: var(--text); border: 1px solid #2f3842; padding: 0 12px; margin-bottom: 16px; }
    button { border: 0; background: var(--accent); color: var(--bg); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Challenge Me</h1>
    <p>Start a match, then send the invite link to the second player. Each phone is one Game Boy: its screen and its buttons.</p>
    <form id="start">
      <label for="game">Game</label>
      <select id="game" name="game">
        <option value="drmario">Dr. Mario (2 players)</option>
        <option value="linkdemo">Link demo (2 players)</option>
        <option value="hello">Hello World</option>
      </select>
      <button>Start match</button>
    </form>
  </main>
  <script type="module" src="/index.js"></script>
</body>
</html>
