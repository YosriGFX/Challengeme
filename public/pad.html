<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101418">
  <title>Challenge Me controller</title>
  <style>
    :root { color-scheme: dark; --bg: #101418; --key: #2a323b; --down: #6cd38a; --text: #e8eef2; --muted: #93a1ad; }
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
                 font: 16px/1.3 system-ui, sans-serif; touch-action: none; }
    body { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); padding: 12px 16px max(16px, env(safe-area-inset-bottom)); }
    header { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
    #conn.on { color: var(--down); }
    .pad { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .dpad { --k: min(72px, 17vw); display: grid; grid-template: repeat(3, var(--k)) / repeat(3, var(--k)); }
    .ab { --k: min(80px, 19vw); display: grid; grid-template: var(--k) var(--k) / var(--k) var(--k); gap: 8px; transform: rotate(-20deg); }
    button { border: 0; border-radius: 14px; background: var(--key); color: var(--text); font: inherit; font-weight: 700; }
    button.down { background: var(--down); color: var(--bg); }
    .ab button { border-radius: 50%; }
    [data-key=up] { grid-area: 1 / 2; } [data-key=left] { grid-area: 2 / 1; }
    [data-key=right] { grid-area: 2 / 3; } [data-key=down] { grid-area: 3 / 2; }
    [data-key=a] { grid-area: 1 / 2; } [data-key=b] { grid-area: 2 / 1; }
    .menu { display: flex; justify-content: center; gap: 24px; }
    .menu button { width: 104px; height: 40px; border-radius: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <header><span id="who">Player</span><span id="conn">connecting…</span></header>
  <div class="pad">
    <div class="dpad">
      <button data-key="up">▲</button><button data-key="left">◀</button>
      <button data-key="right">▶</button><button data-key="down">▼</button>
    </div>
    <div class="ab"><button data-key="b">B</button><button data-key="a">A</button></div>
  </div>
  <div class="menu"><button data-key="select">SELECT</button><button data-key="start">START</button></div>
  <script type="module" src="/pad.js"></script>
</body>
</html>
