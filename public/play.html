<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101418">
  <title>Challenge Me</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root { color-scheme: dark; --bg: #101418; --panel: #1b2128; --key: #2a323b; --down: #6cd38a; --text: #e8eef2; --muted: #93a1ad; --warn: #e07a6a; }
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* No zoom, scroll or bounce: the page is pinned, and the game area (screens and
       buttons) handles every touch itself. Safari also gets its gestures blocked in play.js. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
                 font: 16px/1.3 system-ui, sans-serif; touch-action: none; overscroll-behavior: none; }
    html { position: fixed; inset: 0; width: 100%; }
    body { position: fixed; inset: 0; width: 100%; }
    canvas, figure, .screens, .pad, .menu, [data-key] { touch-action: none; }
    body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; grid-template-columns: minmax(0, 1fr);
           gap: 10px; max-width: 480px; margin: 0 auto; padding: 10px 16px max(16px, env(safe-area-inset-bottom)); }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px;
             color: var(--muted); font-size: 14px; }
    #who, #clock, #peer, #conn { white-space: nowrap; }
    header button { flex: none; }
    #clock { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
    #clock.low { color: var(--warn); }
    header button { height: 28px; padding: 0 10px; border-radius: 14px; font-size: 12px; font-weight: 600; }
    #conn.on { color: var(--down); } #conn.bad { color: var(--warn); }
    /* This phone's Game Boy fills the screen area; the other players' float over the page
       like a video-call picture-in-picture: drag it anywhere, drag its corner to resize it. */
    .screens { position: relative; min-height: 0; display: grid; place-items: center; container-type: size; }
    figure { margin: 0; position: relative; aspect-ratio: 160 / 144; }
    figure.own { width: min(100cqw, 100cqh * 160 / 144); }
    figure.pip { position: fixed; z-index: 5; width: 36%; touch-action: none; cursor: grab;
                 border-radius: 8px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.6); outline: 2px solid var(--muted); }
    body.solo figure.pip { display: none; }
    figure.pip canvas { border-radius: 8px; }
    .resize { position: absolute; right: -6px; bottom: -6px; width: 28px; height: 28px; border-radius: 50%;
              background: var(--muted); border: 3px solid var(--bg); cursor: nwse-resize; touch-action: none; }
    figure.own .resize { display: none; }
    figure.own figcaption { display: none; }   /* the header already says who you are; keep the game's top line clear */
    figcaption { position: absolute; top: 4px; left: 4px; padding: 1px 6px; border-radius: 8px; font-size: 11px;
                 background: rgb(16 20 24 / 0.7); color: var(--text); pointer-events: none; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; background: #000; border-radius: 6px; }
    #invite { display: none; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
    #invite.show { display: flex; }
    #invite div { display: flex; align-items: center; gap: 8px; }
    #invite span { flex: 1; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
    #invite button { flex: none; height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13px; }
    .pad { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .dpad { --k: min(64px, 16vw); display: grid; grid-template: repeat(3, var(--k)) / repeat(3, var(--k)); }
    .ab { --k: min(72px, 18vw); display: grid; grid-template: var(--k) var(--k) / var(--k) var(--k); gap: 6px; transform: rotate(-20deg); }
    button { border: 0; border-radius: 14px; background: var(--key); color: var(--text); font: inherit; font-weight: 700;
             touch-action: manipulation; }   /* no double-tap zoom in Safari when tapping fast */
    button.down { background: var(--down); color: var(--bg); }
    .ab button { border-radius: 50%; }
    [data-key=up] { grid-area: 1 / 2; } [data-key=left] { grid-area: 2 / 1; }
    [data-key=right] { grid-area: 2 / 3; } [data-key=down] { grid-area: 3 / 2; }
    [data-key=a] { grid-area: 1 / 2; } [data-key=b] { grid-area: 2 / 1; }
    .menu { display: flex; justify-content: center; gap: 24px; }
    .menu button { width: 104px; height: 36px; border-radius: 18px; font-size: 13px; }
    #settings { width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 14px; border: 0;
                border-radius: 14px; background: var(--panel); color: var(--text); }
    #settings::backdrop { background: rgb(0 0 0 / 0.6); }
    #settings h2 { margin: 0 0 4px; font-size: 18px; }
    #settings p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    #settings table { width: 100%; border-spacing: 4px 3px; font-size: 12px; }
    #settings thead th { color: var(--muted); font-weight: 600; }
    #settings tbody th { text-align: left; font-size: 13px; }
    #settings .slot { width: 100%; height: 30px; padding: 0 4px; border-radius: 8px; font-size: 12px; font-weight: 600;
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #settings .slot.listen { background: var(--down); color: var(--bg); }
    #settings .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    #settings .row button { height: 34px; padding: 0 16px; border-radius: 17px; font-size: 13px; }
    /* The lobby: who is here and ready. Shown until the server starts the match, and again
       when it pauses or ends. Touches go through to the buttons under it. */
    #lobby { position: fixed; inset: 0; z-index: 8; display: none; place-content: center; pointer-events: none;
             padding: 16px; background: rgb(16 20 24 / 0.6); }
    #lobby.show { display: grid; }
    #lobby .card { width: min(340px, calc(100vw - 32px)); padding: 18px; border-radius: 16px; background: var(--panel);
                   box-shadow: 0 8px 32px rgb(0 0 0 / 0.5); text-align: center; }
    #lobby strong { display: block; font-size: 22px; margin-bottom: 6px; }
    #lobby p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    #lobby ul { list-style: none; margin: 0; padding: 0; text-align: left; font-size: 15px; }
    #lobby li { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--key); }
    #lobby li span:last-child { color: var(--muted); }
    #lobby li.on span:last-child { color: var(--text); }
    #lobby li.ready span:last-child { color: var(--down); font-weight: 700; }
    body.lobby .menu [data-key=start] { position: relative; z-index: 9; animation: nudge 1.2s ease-in-out infinite; }
    @keyframes nudge { 50% { background: var(--down); color: var(--bg); } }
    /* Round and match results, decided by the server and drawn here in the page, never in
       the game's screen. The overlay lets touches through, so play goes on under it. */
    #result { position: fixed; inset: 0; z-index: 10; display: none; place-content: center; text-align: center;
              pointer-events: none; overflow: hidden; background: rgb(16 20 24 / 0.55); }
    #result.show { display: grid; animation: fade 0.2s ease-out; }
    #result strong { font-size: clamp(48px, 18vw, 96px); line-height: 1; letter-spacing: 0.02em;
                     text-shadow: 0 4px 24px rgb(0 0 0 / 0.7); animation: pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
    #result.win strong { color: var(--down); }
    #result.lose strong { color: var(--warn); }
    #result.lose.over strong { animation: pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1), shake 0.5s 0.5s; }
    #result span { margin-top: 12px; font-size: 20px; font-weight: 700; text-shadow: 0 2px 8px rgb(0 0 0 / 0.8); }
    #result i { position: absolute; top: -24px; width: 10px; height: 16px; border-radius: 2px;
                animation: fall var(--t) var(--d) linear forwards; }
    #result.lose i { width: 6px; height: 18px; border-radius: 3px; background: var(--muted); opacity: 0.6; }
    @keyframes fade { from { opacity: 0; } }
    @keyframes pop { from { transform: scale(0.2); opacity: 0; } }
    @keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }
    @media (prefers-reduced-motion: reduce) { #result *, #result.show { animation: none !important; } #result i { display: none; } }
  </style>
</head>
<body>
  <header><span id="who">Player</span><span id="clock" hidden></span><span id="peer"></span><span id="pads"></span><button id="view" type="button">Hide other</button><button id="sound" type="button" aria-label="Sound">🔊</button><button id="controls" type="button" aria-label="Controls">⚙</button><span id="conn">connecting…</span></header>
  <section class="screens">
  </section>
  <div id="invite"></div>
  <div class="pad">
    <div class="dpad">
      <button data-key="up">▲</button><button data-key="left">◀</button>
      <button data-key="right">▶</button><button data-key="down">▼</button>
    </div>
    <div class="ab"><button data-key="b">B</button><button data-key="a">A</button></div>
  </div>
  <div class="menu"><button data-key="select">SELECT</button><button data-key="start">START</button></div>
  <div id="lobby" class="show" role="status"><div class="card"><strong>Connecting…</strong><p></p>
    <ul></ul></div></div>
  <dialog id="settings"></dialog>
  <div id="result" role="status" aria-live="assertive"><strong></strong><span></span></div>
  <script type="module" src="/play.js"></script>
</body>
</html>
